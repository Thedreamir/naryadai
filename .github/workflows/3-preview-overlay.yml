name: Apply verified preview overlay
on:
  push:
    branches: [release/atomic-header-preview-20261008]
    paths: ['.github/workflows/*preview-overlay.yml']
permissions:
  contents: write
jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and overlay
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find . -maxdepth 1 -name '*tekton-overlay.tar.gz' -print -quit)
          test -n "$archive"
          echo "76296f4e484feaccdacb3c57c0c6b2d5af90073cdb8473f946f7f777858c8bf7  $archive" | sha256sum -c -
          mkdir /tmp/tekton-source
          tar xzf "$archive" -C /tmp/tekton-source
          rm -rf /tmp/tekton-source/tekton-reliability-preview/supabase/.temp
          cp -a /tmp/tekton-source/tekton-reliability-preview/. .
          rm "$archive" .github/workflows/*preview-overlay.yml
          rm -rf .github/workflows/.github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply verified atomic header preview overlay'
          git push
