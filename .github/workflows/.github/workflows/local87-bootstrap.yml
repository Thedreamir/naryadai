name: Prepare sanitized local source
on:
  push:
    branches: [release/local87-sanitized-20261009]
    paths: ['.github/workflows/*local87-bootstrap.yml']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and install sanitized source
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find . -maxdepth 1 -name '*local87-sanitized-source.tar.gz' -print -quit)
          test -n "$archive"
          echo "85de36875506a8f592d93ea886ee3438e2ca5090100072d26f709b77aebddc16  $archive" | sha256sum -c -
          mkdir /tmp/source
          tar -xzf "$archive" -C /tmp/source
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/source')
          assert json.loads((root/'vercel.json').read_text())['git']['deploymentEnabled'] is False
          assert not any(p.name=='.git' for p in root.rglob('*'))
          PY
          git rm -r --ignore-unmatch .
          cp -a /tmp/source/. .
          git add -A
          git config user.name 'Tekton Source'
          git config user.email 'source@example.invalid'
          git commit -m 'Publish sanitized local source, deployments disabled'
          git push origin HEAD:release/local87-sanitized-20261009
